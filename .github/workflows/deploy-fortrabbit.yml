name: Deploy to Fortrabbit

on:
  push:
    branches:
      - claude/equestrian-competition-project-0CEUO

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FORTRABBIT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ssh.eu-w1a.frbit.app >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Fortrabbit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/build -f
          git commit -m "Build assets production [skip ci]" || true
          git remote add fortrabbit ${{ secrets.FORTRABBIT_GIT_URL }}
          git push fortrabbit HEAD:main --force
